[nosetests]
verbosity=2
with-coverage=True
cover-package=service
cover-erase=True
cover-inclusive=True
detailed-errors=True

[coverage:run]
branch=True
source=service

[coverage:report]
show_missing=True
skip_covered=False

[flake8]
max-line-length=100
exclude=.git,**pycache**,.venv,venv
ignore=E203,W503

[pylint]
disable=C0114,C0115,C0116
max-line-length=100
